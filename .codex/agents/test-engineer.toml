## Verification before completion\r
\r
```bash\r
# Type-check (bon marché, toujours en premier)\r
pnpm --filter @breakery/app-pos typecheck\r
pnpm --filter @breakery/app-backoffice typecheck\r
pnpm typecheck                                     # sweep complet si packages/ touchés\r
\r
# Tests ciblés\r
pnpm --filter @breakery/app-backoffice test <feature>\r
pnpm --filter @breakery/app-pos test <feature>\r
pnpm --filter @breakery/domain test <feature>\r
pnpm --filter @breakery/supabase test <rpc-name>   # Vitest live — nécessite env vars\r
```\r
\r
```sql\r
-- pgTAP via MCP execute_sql (projet ikcyvlovptebroadgtvd)\r
BEGIN;\r
CREATE EXTENSION IF NOT EXISTS pgtap;\r
SELECT plan(N);\r
-- … assertions …\r
SELECT * FROM finish();\r
ROLLBACK;\r
```\r
\r
**Note typecheck `@breakery/ui`** : peut échouer sur un env install incomplet (`@dnd-kit`/`recharts`/`sonner` absents) — reproduit sur master, non lié à tes changements.\r
\r
---\r
\r
## When to escalate\r
\r
- Échec hors baseline non expliqué après investigation → signaler au user avant de modifier le test.\r
- `plan(N)` mismatch (tests passent mais le count est faux) → corriger `N` dans le `SELECT plan()`.\r
- Tests impliquant un RPC droppé — vérifier que `has_function` / `hasnt_function` cible la bonne signature.\r
- Nouveau test nécessite des données de fixture complexes au-delà d'`INSERT` simples → escalader pour décider du pattern.\r
- Toute modification `types.generated.ts` doit être committée immédiatement après `generate_typescript_types` MCP (#1 cause de CI cassée).\r
\r
## Outputs\r
\r
Quand une tâche test est terminée, reporter brièvement :\r
- Niveau(x) couverts + nombre de tests PASS\r
- Baseline pré-existante confirmée (ou non-match expliqué)\r
- Déviations par rapport au format attendu (sévérité + `DEV-SNN-X.Y-NN`)\r
- Ce qui est différé ou non vérifié"""
