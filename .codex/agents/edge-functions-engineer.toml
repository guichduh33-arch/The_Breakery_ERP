\r
## Critical patterns (toujours vérifier avant de livrer)\r
\r
### 1. PIN/secret en header HTTP, jamais en body JSON\r
\r
Header `x-manager-pin` (jamais dans le body JSON). Le body est loggé par PostgREST/pgaudit/proxies/Supabase function logs ; les headers ne le sont pas.\r
\r
**Hard cutover** : dropper le champ body dans le **même commit** que le read header — pas de dual-mode fallback (sauf callers externes non contrôlés, rare sur ce projet). Référence : `refund-order/index.ts` lignes 58-61.\r
\r
```ts\r
// ✅ Correct\r
const managerPin = req.headers.get('x-manager-pin');\r
if (!managerPin || managerPin.trim().length === 0) {\r
  return jsonResponse({ error: 'missing_manager_pin' }, 400);\r
}\r
// Puis passer à verifyManagerPin(managerPin)\r
```\r
\r
### 2. Idempotency — 2 flavors, choisir la bonne\r
\r
**Flavor 1 — HTTP `x-idempotency-key` header (retry safety)** : pour les flows où le client peut légitimement retenter (réseau flaky, double-tap, RQ auto-retry).\r
\r
- Client : `const keyRef = useRef(crypto.randomUUID())` — reset sur success/dismiss.\r
- EF : `getIdempotencyKey(req)` depuis `_shared/idempotency.ts` (lit `x-idempotency-key`, valide UUID regex, retourne `string | null`). Propager en `p_idempotency_key` au RPC.\r
- Replay audit : si `data.idempotent_replay === true`, insérer dans `audit_logs` avec action `*.replay` (voir `refund-order` lignes 143-158).\r
\r
```ts\r
import { getIdempotencyKey, InvalidIdempotencyKeyError } from '../_shared/idempotency.ts';\r
\r
let idempotencyKey: string | null = null;\r
try {\r
  idempotencyKey = getIdempotencyKey(req);      // optionnel\r
  // ou getIdempotencyKey(req, { required: true }) // obligatoire\r
} catch (err) {\r
  if (err instanceof InvalidIdempotencyKeyError) {\r
    return jsonResponse({ error: err.code, message: err.message }, 400);\r
  }\r
  throw err;\r
}\r
```\r
\r
**Flavor 2 — RPC arg `p_client_uuid` / `p_idempotency_key` (idempotence sémantique métier)** : table dédiée, PK `unique_violation` + re-read. Géré côté RPC, pas côté EF — voir AGENTS.md §Idempotency 2-flavors.\r
\r
### 3. Rate-limit durable Postgres (S19)\r
\r
`checkRateLimitDurable` → RPC `record_rate_limit_v1` + `pg_advisory_xact_lock` (protection race condition). **Fail-open sur erreur DB** (trade-off documenté, DEV-S19-1.A-02). Toujours appeler **avant** toute lecture header/body — voir `refund-order` lignes 49-56.\r
\r
```ts\r
import { checkRateLimitDurable, getClientIp } from '../_shared/rate-limit.ts';\r
import { rateLimitedResponse } from '../_shared/responses.ts';\r
\r
const ip = getClientIp(req);\r
const rl = await checkRateLimitDurable({\r
  functionName: 'my-function',\r
  bucketKey:    `ip:${ip}`,\r
  ipAddress:    ip,\r
  maxPerWindow: 10,\r
  windowSec:    60,\r
});\r
if (!rl.allowed) return rateLimitedResponse(rl.retryAfterSec);\r
```\r
\r
EFs rate-limitées (S19) : `auth-verify-pin`, `kiosk-issue-jwt` (2 buckets), `refund-order`, `void-order`, `cancel-item`.\r
\r
### 4. JWT HS256 vs GoTrue ES256 — fetch wrapper obligatoire\r
\r
`auth-verify-pin` émet des JWT **HS256** que GoTrue (ES256) ne peut pas valider via le header `Authorization` standard. Le client Supabase utilise un fetch wrapper `setSupabaseAccessToken` (`packages/supabase`) pour injecter le PIN JWT sur chaque requête.\r
\r
- **Ne jamais bypasser** avec `Authorization: Bearer <pin_jwt>` brut ni `auth.setSession`.\r
- **Ne jamais exposer** le JWT HS256 dans les logs ou le body.\r
\r
### 5. Admin client pour RPCs service_role-only\r
\r
Depuis S34, `refund_order_rpc` (version `_vN` — vérifier AGENTS.md/migrations) est `service_role`-only (PostgREST ne peut pas l'appeler directement). L'EF utilise `getAdminClient()` et passe `p_acting_auth_user_id` (résolu via `getActingAuthUserId(req)`) pour tracer l'acteur réel. Utiliser ce pattern pour toute nouvelle EF appelant un RPC qui ne doit pas être appelable par `authenticated`.\r
\r
