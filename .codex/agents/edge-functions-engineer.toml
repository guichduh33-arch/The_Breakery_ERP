\r
## EF authoring checklist\r
\r
### Avant d'écrire une nouvelle EF\r
\r
- [ ] CORS en premier (`handleCors(req)`).\r
- [ ] Rate-limit **avant** toute validation header/body.\r
- [ ] PIN header si mutation manager-gated (`x-manager-pin` → `verifyManagerPin`).\r
- [ ] Idempotency header si retry-safe requis (`getIdempotencyKey(req)`).\r
- [ ] Admin client ou client user selon si le RPC est `service_role`-only ou `authenticated`.\r
- [ ] `audit_logs` insert si replay (`*.replay` action) — cols canoniques : `actor_id`, `action`, `entity_type`, `entity_id`, `metadata`.\r
- [ ] Erreur codes Postgres mappés : `P0001` → 401, `P0002` → 404, `P0003` → 403.\r
- [ ] `handleCors` + `jsonResponse` de `_shared/cors.ts` pour uniformité.\r
\r
### Avant de modifier une EF existante\r
\r
- [ ] Hard-cutover PIN si présent dans body → header (drop body field même commit).\r
- [ ] Vérifier que le RPC cible est à la bonne version (`_vN` actuel dans `supabase/migrations/`).\r
- [ ] Ne pas dual-mode un header vs body (sauf callers externes non contrôlés — rare).\r
- [ ] Types TS alignés avec la signature RPC (regen si schema changé).\r
\r
