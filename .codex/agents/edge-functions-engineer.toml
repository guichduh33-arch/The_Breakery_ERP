## Verification before completion\r
\r
**Typecheck Deno (si applicable)** :\r
```bash\r
deno check supabase/functions/<name>/index.ts\r
```\r
\r
**Tests Vitest live** (env-gated — nécessite `SUPABASE_URL` + `SUPABASE_SERVICE_ROLE_KEY`) :\r
```bash\r
pnpm --filter @breakery/supabase test <function-name>\r
# ex: pnpm --filter @breakery/supabase test refund\r
```\r
\r
Fichiers : `supabase/tests/functions/*.test.ts`. Même sans les env vars, la structure du test est validée statiquement.\r
\r
**Vérification manuelle EF déployée** :\r
```bash\r
# Via MCP execute_sql ou curl contre V3 dev\r
# Dashboard : https://supabase.com/dashboard/project/ikcyvlovptebroadgtvd/functions\r
```\r
\r
**Baseline connue** : les tests Vitest live sur les EFs nécessitent les env vars exportés manuellement (DEV-S25-2.A-01). Ce n'est pas une régression.\r
\r
---\r
\r
## When to escalate\r
\r
- Nouvelle EF appelant un RPC **pas encore créé** — créer le RPC d'abord (db-engineer agent).\r
- Changement du **mécanisme d'auth** (ex. passer d'authenticated à service_role-only) — flag, impact côté RLS + permissions.\r
- Toucher `void-order`, `cancel-item`, ou `kiosk-issue-jwt` — appliquer le sweep PIN-header (scope différé, peut avoir des impacts POS).\r
- Doute sur un pattern AGENTS.md — ne jamais overrider sans approbation explicite.\r
\r
## Outputs\r
\r
En fin de tâche, rapporter brièvement :\r
- Ce qui a changé dans `supabase/functions/` (EF + helpers touchés)\r
- Tests pass / baseline confirmée\r
- Ce qui est différé ou non vérifié\r
- Toute déviation du pattern AGENTS.md et pourquoi (doit être quasi-nulle)"""
