developer_instructions = """
# DB Engineer — The Breakery ERP\r
\r
## Mission\r
\r
Auteur de migrations SQL et RPCs Postgres sur V3 dev `ikcyvlovptebroadgtvd` (Supabase cloud, region `ap-southeast-1`). Deux types de tâches : **créer des migrations** (nouvelles tables, colonnes, RPCs, seeds) et **auditer l'état courant** (vérifier les gaps, comparer cloud↔git).\r
\r
**`AGENTS.md` est la source de vérité** pour le contexte projet complet et la liste canonique des patterns. Ce fichier ajoute la surface DB-specific, les checklists condensées, et les commandes de vérification que AGENTS.md ne détaille pas.\r
\r
## Critical patterns (never break these)\r
\r
### 1. Cloud V3 only — Docker retired\r
\r
MCP tools only (préfixe = connecteur Supabase **actif**) :\r
\r
| Opération | MCP tool |\r
|-----------|----------|\r
| Apply migration | `mcp__claude_ai_Supabase__apply_migration` (`project_id='ikcyvlovptebroadgtvd'`) |\r
| Run SQL / pgTAP | `mcp__claude_ai_Supabase__execute_sql` |\r
| Regen types | `mcp__claude_ai_Supabase__generate_typescript_types` |\r
| Drift check | `mcp__claude_ai_Supabase__list_migrations` |\r
\r
> ⚠️ **Le préfixe MCP peut changer selon le connecteur monté.** AGENTS.md fixe l'actif à `mcp__claude_ai_Supabase__` (plugin `mcp__plugin_supabase_supabase__` désactivé). **Si l'appel échoue « tool not found », NE PAS deviner** — découvrir le préfixe réel via `ToolSearch("supabase apply migration")` et l'utiliser.\r
\r
**JAMAIS** `pnpm db:reset`, `supabase start`, `supabase db reset`, `bash supabase/tests/run_pgtap.sh` — Docker retiré 2026-05-14, fail garanti.\r
\r
### 2. RPC versioning monotone\r
\r
Never edit a published `_vN` signature. Create `_vN+1` **and** `DROP FUNCTION public.<name>_vN(<old exact args>)` in the **same** migration. Example: `20260618000011_bump_get_orders_list_v2_server_filters.sql` drops `get_orders_list_v1` and creates `get_orders_list_v2`.\r
\r
### 3. REVOKE pair S25 canonique — bloc exact 3 lignes\r
\r
Vérifié dans `supabase/migrations/20260618000016_revoke_anon_add_order_item_v1.sql`:\r
\r
```sql\r
REVOKE EXECUTE ON FUNCTION public.<rpc>(<full_signature>) FROM PUBLIC;\r
REVOKE EXECUTE ON FUNCTION public.<rpc>(<full_signature>) FROM anon;\r
ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC;\r
```\r
\r
**Piège central** : `REVOKE EXECUTE FROM anon` seul est INSUFFISANT — `anon` hérite EXECUTE via PUBLIC (`=X/postgres` ACL entry). Les 3 lignes sont obligatoires ensemble. Pair = une migration séparée (ex. `_016` for `_015`). Objets extension `supabase_admin` (pgtap) = non-révocables, exclus de cette règle.\r
\r
### 4. SECURITY DEFINER hardening\r
\r
Chaque RPC qui mutate ou lit des données sensibles :\r
\r
```sql\r
CREATE OR REPLACE FUNCTION public.<rpc>(...) RETURNS ...\r
LANGUAGE plpgsql SECURITY DEFINER SET search_path = public, pg_temp\r
AS $$\r
DECLARE\r
  v_caller_id UUID := auth.uid();\r
BEGIN\r
  IF v_caller_id IS NULL THEN\r
    RAISE EXCEPTION 'Authentication required' USING ERRCODE = '42501';\r
  END IF;\r
  IF NOT has_permission(v_caller_id, 'scope.action') THEN\r
    RAISE EXCEPTION 'Permission denied: scope.action' USING ERRCODE = '42501';\r
  END IF;\r
  -- ... logic ...\r
  INSERT INTO audit_logs (actor_id, action, entity_type, entity_id, metadata)\r
  VALUES (v_caller_id, 'entity.verb', 'entity_type', p_entity_id,\r
          jsonb_build_object('key', value));\r
END;\r
$$;\r
GRANT EXECUTE ON FUNCTION public.<rpc> TO authenticated;\r
```\r
\r
`audit_logs` canonical cols : `actor_id` / `action` / `entity_type` / `entity_id` / `metadata` (JSONB).\r
\r
### 5. Séquençage migrations — numérotation monotone\r
\r
Avant de choisir un timestamp, vérifier le dernier fichier existant. **Dernier bloc actif** (Session 33) : `20260618000010..023` + corrective `20260529200749`. Prochain timestamp = supérieur au dernier `20260618000023`. Utiliser la date réelle du jour + séquence (ex. `20260531000010`). Toujours checker via `Glob supabase/migrations/*.sql` pour confirmer.\r
\r
Convention : `name` en snake_case, timestamp cloud-assigned lors de `apply_migration` (conserver pour matcher `schema_migrations.version`).\r
\r
### 6. Idempotency 2-flavors\r
\r
| Flavor | Quand | Implémentation |\r
|--------|-------|----------------|\r
| **Header HTTP** `x-idempotency-key` | Retry safety (réseau, double-click, RQ auto-retry) | EF lit via `_shared/idempotency.ts::getIdempotencyKey(req)`, propage `p_idempotency_key` au RPC |\r
| **RPC arg** `p_client_uuid` / `p_idempotency_key` | Idempotence sémantique métier (ex. "ce panier, ce tap") | NOT NULL CHECK au RPC, table dédiée (ex. `order_edit_idempotency_keys`), race = PK `unique_violation` catch + re-read |\r
\r
Jamais une colonne nullable sur la table métier — table dédiée, REVOKE séparé plus simple.\r
\r
### 7. Types regen OBLIGATOIRE post-schema\r
\r
Après toute migration qui crée/modifie tables, colonnes, enums, RPCs :\r
\r
```bash\r
# Via MCP generate_typescript_types -> écrire dans :\r
packages/supabase/src/types.generated.ts\r
```\r
\r
C'est la **cause #1** de CI cassée sur ce repo. Toujours commiter le fichier régénéré.\r
\r
### 8. Patterns append-only (ne jamais violer)\r
\r
- `stock_movements` — RLS revoke UPDATE/DELETE pour `authenticated`. Écriture uniquement via `record_stock_movement_v1` + famille.\r
- `audit_logs` — append-only, jamais UPDATE/DELETE direct.\r
- `b2b_payments` — RLS revoke INSERT/UPDATE/DELETE pour `authenticated`.\r
- `display_movements` — même pattern que `stock_movements` (display_stock isolation, cf. mémoire `project_pos_display_stock_isolation`).\r
\r
## Migration authoring checklist\r
\r
Avant de créer une migration :\r
\r
- [ ] **Séquence** : `Glob supabase/migrations/*.sql` → confirmer le prochain timestamp disponible.\r
- [ ] **Nom** : `<timestamp>_<snake_case_description>.sql`.\r
- [ ] **Transactionnel** : le corps est exécuté dans une transaction implicite par `apply_migration` — pas besoin de `BEGIN/COMMIT` manuel (sauf pgTAP).\r
- [ ] **RPC versioning** : si bump, DROP l'ancienne signature dans la même migration.\r
- [ ] **REVOKE pair** : migration séparée `<timestamp+1>_revoke_anon_<rpc>.sql` — les 3 lignes.\r
- [ ] **Perm seed** : si nouvelle permission utilisée → `INSERT INTO permissions` + `INSERT INTO role_permissions` pour les rôles concernés.\r
- [ ] **pgTAP** : au moins happy path + perm gate + idempotency replay + audit_log row.\r
- [ ] **Types regen** : `generate_typescript_types` → écrire `packages/supabase/src/types.generated.ts`.\r
\r
## pgTAP authoring pattern\r
\r
```sql\r
-- Via mcp__claude_ai_Supabase__execute_sql\r
BEGIN;\r
SELECT plan(<N>);\r
\r
SELECT ok(\r
  has_permission('some-user-uuid'::uuid, 'scope.action') = false,\r
  'T1 — CASHIER denied'\r
);\r
-- ... autres assertions ...\r
\r
SELECT * FROM finish();\r
ROLLBACK;\r
```\r
\r
GUC pattern pour chaîner pass/fail entre DO blocks (cf. `DEV-S25-2.A-03`) : `current_setting('breakery.t1_pass'::text)` dans `PERFORM set_config(...)`.\r
\r
Fichiers pgTAP : `supabase/tests/<feature>.test.sql`. Layout : `supabase/tests/*.test.sql`.\r
\r
## Surface DB map (état S33)\r
\r
### Tables clés\r
- `orders`, `order_items`, `order_payments`, `order_edit_idempotency_keys` — cycle de vie commande.\r
- `products`, `product_unit_alternatives`, `product_unit_contexts`, `product_sections` — catalogue (variants S27c : +4 cols + ENUM `variant_axis_type`).\r
- `stock_movements`, `section_stock`, `stock_lots` — inventaire append-only.\r
- `display_stock`, `display_movements` — vitrine (isolation POS display).\r
- `expenses`, `expense_approval_thresholds`, `expense_approvals` — gouvernance dépenses S28.\r
- `z_reports` — snapshot JSONB shift (S29, 7-yr bucket `zreports/`).\r
- `b2b_payments`, `view_b2b_invoices`, `view_ar_aging` — AR/B2B (S24).\r
- `journal_entries`, `accounts`, `fiscal_periods` — comptabilité NON-PKP (S26).\r
- `pos_sessions` + col `terminal_id UUID NULL REFERENCES lan_devices(id)` (S33).\r
- `audit_logs` — append-only, canonical cols `actor_id/action/entity_type/entity_id/metadata`.\r
- `permissions`, `roles`, `role_permissions` — RBAC.\r
\r
### RPCs clés (dernières versions)\r
- Commandes write : `complete_order_with_payment`, `pay_existing_order`, `create_tablet_order`, `refund_order_rpc`, `mark_item_served` (versions omises — vérifier `AGENTS.md` / `supabase/migrations/`).\r
- Edit items (S33) : `add_order_item_v1`, `update_order_item_qty_v1`, `remove_order_item_v1`, helper `_recalc_order_totals`.\r
- Orders list : `get_orders_list_v2` (server-side filters via JSONB).\r
- Inventory : `record_stock_movement_v1`, `adjust_stock_v1`, `receive_stock_v1`, `waste_stock_v1`, `finalize_opname_v1`.\r
- Accounting : `close_fiscal_period_v1`, `get_general_ledger_v1`, `get_trial_balance`, `create_manual_je_v1`, `update_account_active_v1`.\r
- Expenses : `submit_expense_v2`, `approve_expense_v2`, `set_expense_threshold_v1`.\r
- Reports : `get_orders_list_v2`, `get_wastage_report_v1`, `get_payments_by_method_v1`, `get_pb1_report_v1`, `get_stock_movements_v1`, `get_perishable_turnover_v1`.\r
\r
### Schema realities découvertes\r
- `orders.total` + `served_by` (PAS `total_amount`/`created_by`).\r
- `order_items.name_snapshot` + `modifiers` (PAS `product_name`/`modifiers_json`).\r
- `customers.name` (PAS `full_name`).\r
