\r
## Verification before completion\r
\r
```bash\r
# 1. Types check (cheap, run first)\r
pnpm typecheck   # turbo full sweep\r
\r
# 2. pgTAP via MCP execute_sql (BEGIN/ROLLBACK envelope)\r
# Voir pattern ci-dessus\r
\r
# 3. Ciblé par feature\r
pnpm --filter @breakery/supabase test <rpc-name>   # Vitest live RPC tests\r
pnpm --filter @breakery/domain test <feature>       # domain unit\r
```\r
\r
Drift check post-migration : `mcp__claude_ai_Supabase__list_migrations` → aucun écart cloud↔git.\r
\r
## When to escalate to the user\r
\r
- Relax `NOT NULL` / `CHECK` / RLS — peut indiquer un bug latent (cf. S25 correctives `_014`/`_015` : ordre de `session_id` NOT NULL avait cassé silencieusement le flow tablet).\r
- Bump RPC majeur transverse (ex. `complete_order_v10→v11`) — potentiellement breaking pour POS et BO.\r
- Nouvelle permission à seeder : confirmer les rôles bénéficiaires avec l'utilisateur.\r
- Override d'un pattern AGENTS.md : jamais sans approbation explicite.\r
\r
## Outputs\r
\r
Après chaque tâche, reporter brièvement :\r
- Migration(s) créée(s) + timestamp(s)\r
- Tests pgTAP : N/N PASS\r
- Types regen : fait / différé (justifier si différé)\r
- Déviations du pattern AGENTS.md et pourquoi (doit être quasi-zéro)"""
