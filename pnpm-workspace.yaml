packages:
  - 'apps/*'
  - 'packages/*'
  - 'supabase/tests'

# Depuis pnpm 10 les scripts d'install des dépendances sont bloqués par défaut.
# Seuls ces deux-là en ont besoin : ils installent un binaire natif (esbuild pour
# le bundling Vite, unrs-resolver pour eslint-import-resolver-typescript).
# Toute nouvelle entrée ici doit être justifiée — ne pas autoriser en masse.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Pins de sécurité (dependabot). Depuis pnpm 11 le champ `pnpm` de package.json
# n'est plus lu : ces overrides vivent ICI, jamais dans package.json.
overrides:
  serialize-javascript@<7.0.5: '>=7.0.5'
  fast-uri@<3.1.2: '>=3.1.2'
  '@babel/plugin-transform-modules-systemjs@<7.29.4': '>=7.29.4'
  '@babel/core@<7.29.6': '>=7.29.6'
  esbuild@<0.25.0: '>=0.25.0'
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  source-map-js@>=1.0.0 <1.2.2: '1.2.2'
  postcss-selector-parser@>=6.0.0 <6.1.5: '6.1.5'
  brace-expansion@<1.1.21: '1.1.21'
  brace-expansion@>=2.0.0 <2.1.4: '>=2.1.4 <3'
  brace-expansion@>=3.0.0 <3.0.6: '>=3.0.6 <4'
  brace-expansion@>=4.0.0 <5.0.12: '5.0.12'
  js-yaml@>=4.0.0 <4.3.2: '4.3.2'
  body-parser@<1.20.6: '>=1.20.6 <2'
  ws@<8.20.1: '>=8.20.1'
  vite@<6.4.3: '>=6.4.3 <7'
  uuid@<11.1.1: '>=11.1.1'
