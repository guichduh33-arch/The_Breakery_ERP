# Les tests live-RPC écrivent dans la base dev partagée : lancement manuel
# uniquement, avec acceptation explicite des opérations et stocks modifiés.
name: Vitest Live (targeted)

on:
  workflow_dispatch:
    inputs:
      allow_dev_mutations:
        description: 'I accept that these tests create operations and change stocks on dev V3'
        required: true
        type: boolean
        default: false
      filter:
        description: 'Fichiers/patterns vitest (espace-séparés), vide = suite complète'
        required: false
        default: ''

jobs:
  vitest:
    if: github.event_name == 'workflow_dispatch' && inputs.allow_dev_mutations == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://ikcyvlovptebroadgtvd.supabase.co
      VITE_SUPABASE_URL: https://ikcyvlovptebroadgtvd.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run live-RPC Vitest suite (targeted)
        env:
          TEST_FILTER: ${{ inputs.filter }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set." >&2
            exit 1
          fi
          if [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY secret is not set." >&2
            exit 1
          fi
          # L'entrée utilisateur n'est jamais interpolée comme du code shell.
          read -r -a filters <<< "$TEST_FILTER"
          for filter in "${filters[@]}"; do
            if [[ "$filter" == -* ]]; then
              echo "::error::Only file filters are accepted, not Vitest options." >&2
              exit 1
            fi
          done
          pnpm --filter @breakery/supabase-tests test "${filters[@]}" --passWithNoTests=false --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/live-tests.json"
          node scripts/agents/check-evidence.mjs "$RUNNER_TEMP/live-tests.json"
