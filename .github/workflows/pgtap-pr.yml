name: pgTAP PR

# TEST-02 (Session 37) — PR-time pgTAP gate.
#
# Lot 1.B (2026-08-03) — le gate passe du SMOKE (12 fichiers choisis à la main)
# à la SUITE ENTIÈRE. Avant ce lot, 186 des 198 fichiers pgTAP ne tournaient
# jamais sur PR : chaque lot livré l'était sans filet, et la seule couverture
# complète était un run nocturne 3×/semaine — donc après merge.
# Coût mesuré au lot 1.B : ~15 min de runner pour 198 fichiers en série.
# 2026-11-17 — mesuré ~45 min pour 369 fichiers : la suite est découpée en morceaux
# parallèles par scripts/ci/pgtap-shards.mjs (voir le job pgtap-shard).
#
# Le run nocturne (pgtap-nightly.yml) reste : il couvre master et la dérive
# des types. Les deux workflows appellent le même script de découpage.
#
# Toutes les PR rendent db-gate ; seules les modifications DB lancent pgTAP.

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgtap-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      applicable: ${{ steps.scope.outputs.applicable }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: scope
        run: node scripts/ci/db-gate.mjs classify

  plan:
    needs: classify
    if: needs.classify.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Plancher sur le total et partition déterministe : scripts/ci/pgtap-shards.mjs.
      - id: plan
        run: node scripts/ci/pgtap-shards.mjs plan

  # 2026-11-17 — la suite passe d'un job série (~45 min mesurées sur #717) à
  # des morceaux parallèles. Un fichier instable ne relance plus que son
  # morceau (« Re-run failed jobs »). La preuve reste UNE : le job `pgtap`
  # ci-dessous, que db-gate et le preflight de release exigent par son nom.
  pgtap-shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Même approche psql que pgtap-nightly.yml — les deux appellent le même script.
      # Quota 2026-07 — psql préinstallé sur le runner ubuntu-latest.
      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Run pgTAP shard via pooler
        env:
          PGURL: ${{ secrets.V3_DEV_PG_POOLER_URL }}
        run: node scripts/ci/pgtap-shards.mjs run "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pgtap-results-${{ matrix.shard }}
          path: pgtap-results/${{ matrix.shard }}.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  # Les fichiers qui posent un DDL sur un objet partagé (verrou fort tenu
  # jusqu'au ROLLBACK) tournent seuls, après les morceaux parallèles.
  pgtap-exclusive:
    needs: [plan, pgtap-shard]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Run exclusive pgTAP files via pooler
        env:
          PGURL: ${{ secrets.V3_DEV_PG_POOLER_URL }}
        run: node scripts/ci/pgtap-shards.mjs run exclusive
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pgtap-results-exclusive
          path: pgtap-results/exclusive.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  # Agrégat sous le nom historique `pgtap`. Vert seulement si chaque morceau
  # est vert ET si l'union des fichiers exécutés égale exactement le plan.
  pgtap:
    needs: [classify, plan, pgtap-shard, pgtap-exclusive]
    if: ${{ always() && needs.classify.outputs.applicable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require every shard to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARDS_RESULT: ${{ needs.pgtap-shard.result }}
          EXCLUSIVE_RESULT: ${{ needs.pgtap-exclusive.result }}
        run: |
          echo "plan=${PLAN_RESULT} shards=${SHARDS_RESULT} exclusive=${EXCLUSIVE_RESULT}"
          if [ "$PLAN_RESULT" != success ] || [ "$SHARDS_RESULT" != success ] || [ "$EXCLUSIVE_RESULT" != success ]; then
            echo "::error::au moins un morceau pgTAP n'est pas vert"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: pgtap-results-*
          path: pgtap-results
          merge-multiple: true
      - name: Check executed files against the plan
        run: node scripts/ci/pgtap-shards.mjs aggregate pgtap-results

  db-gate:
    if: ${{ always() }}
    needs: [classify, pgtap]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require applicable DB evidence
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify.result }}
          DB_APPLICABLE: ${{ needs.classify.outputs.applicable }}
          DB_REASON: ${{ needs.classify.outputs.reason }}
          PGTAP_RESULT: ${{ needs.pgtap.result }}
        run: node scripts/ci/db-gate.mjs check
