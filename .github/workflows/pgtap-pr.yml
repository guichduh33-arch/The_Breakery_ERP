name: pgTAP PR

# TEST-02 (Session 37) — PR-time pgTAP gate.
#
# Lot 1.B (2026-08-03) — le gate passe du SMOKE (12 fichiers choisis à la main)
# à la SUITE ENTIÈRE. Avant ce lot, 186 des 198 fichiers pgTAP ne tournaient
# jamais sur PR : chaque lot livré l'était sans filet, et la seule couverture
# complète était un run nocturne 3×/semaine — donc après merge.
# Coût mesuré : ~15 min de runner pour 198 fichiers en série.
#
# Le run nocturne (pgtap-nightly.yml) reste : il couvre master, la dérive des
# types et la suite Vitest live-RPC. Les deux boucles psql sont volontairement
# identiques — toute modification de l'une se reporte sur l'autre.
#
# Scope: only fires on PRs that touch DB surface (migrations, pgTAP tests,
# Edge Functions) — front-only PRs skip it entirely (paths filter below).

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/**'
  workflow_dispatch:

concurrency:
  group: pgtap-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    # Dependabot-triggered runs read from the separate "Dependabot secrets"
    # store, so V3_DEV_PG_POOLER_URL is empty there and the secret guard below
    # hard-fails. Dependency bumps can't break the DB schema — skip instead.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Lot 1.B — 25 min : le run complet mesuré ~15 min, la marge absorbe la
    # contention sur la base dev partagée (le nightly sérialise pgtap et
    # live-rpc-vitest pour la même raison).
    timeout-minutes: 25
    # S50: flipped to false — V3_DEV_PG_POOLER_URL confirmed present (same as
    # nightly). Failures now block the PR. Revert to true only if the secret
    # becomes unavailable for fork PRs (rare on this private repo).
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7

      # Same psql approach as pgtap-nightly.yml — keep the two in sync.
      # Quota 2026-07 — psql préinstallé sur le runner ubuntu-latest ; on
      # n'ajoute plus le dépôt pgdg (~1-2 min économisées par run).
      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Run pgTAP suite via pooler
        id: pgtap
        env:
          PGURL: ${{ secrets.V3_DEV_PG_POOLER_URL }}
          # Plancher de fichiers attendus. Un glob cassé, un checkout partiel ou
          # un déplacement de répertoire rendrait sinon le job VERT À VIDE — le
          # mode de panne le plus coûteux d'un gate, puisqu'il ne se voit pas.
          # À relever quand la suite grossit franchement.
          PGTAP_MIN_FILES: '180'
        run: |
          set -uo pipefail
          if [ -z "${PGURL:-}" ]; then
            echo "::error::V3_DEV_PG_POOLER_URL secret is not set" >&2
            exit 1
          fi
          shopt -s nullglob
          files=(supabase/tests/*.test.sql)
          echo "Fichiers pgTAP découverts : ${#files[@]}"
          if [ "${#files[@]}" -lt "$PGTAP_MIN_FILES" ]; then
            echo "::error::seulement ${#files[@]} fichiers pgTAP découverts (plancher ${PGTAP_MIN_FILES}) — glob ou checkout suspect, le gate refuse de passer vert à vide" >&2
            exit 1
          fi
          fail_count=0
          fail_list=""
          for f in "${files[@]}"; do
            echo "=== Running $f ==="
            # S77: fail on psql error OR any TAP 'not ok' line (assertion
            # failures never flip psql's exit code — mirror of pgtap-nightly).
            # `|| rc=$?` keeps the runner's implicit `bash -e` from killing
            # the loop on the first failing file.
            rc=0
            out=$(psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f" 2>&1) || rc=$?
            printf '%s\n' "$out"
            not_ok=$(printf '%s\n' "$out" | grep -cE '^[[:space:]]*not ok [0-9]' || true)
            if [ "$rc" -ne 0 ] || [ "$not_ok" -gt 0 ]; then
              fail_count=$((fail_count+1))
              fail_list="${fail_list}\n - ${f} (exit=${rc}, not_ok=${not_ok})"
            fi
          done
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::${fail_count} pgTAP file(s) failed:${fail_list}"
            exit 1
          fi
          echo "All ${#files[@]} pgTAP files passed."
