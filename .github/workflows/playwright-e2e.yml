name: Playwright E2E

# Les applications nécessaires à la suite choisie sont compilées et servies
# en localhost par Playwright, contre DEV V3. Aucun hébergement staging/Vercel.
#
# Required secrets:
#   VITE_SUPABASE_ANON_KEY   — dev V3 anon (publishable) key (build-time)
#   E2E_PIN_ADMIN            — 6-digit PIN for E2E owner  (0e2e0000-…-001)
#   E2E_PIN_CASHIER          — compte caisse E2E, préparation pour « all » seulement
#   V3_DEV_PG_POOLER_URL     — pooler connection string (already set 2026-05-16)
#
# Exécution manuelle uniquement : ces tests écrivent sur la base dev V3.
on:
  workflow_dispatch:
    inputs:
      allow_dev_mutations:
        description: 'I accept that these tests create operations and change stocks on dev V3'
        required: true
        type: boolean
        default: false
      suite:
        description: 'Scenarios to execute; purchase-invoices is a targeted BO recipe, not the complete suite'
        required: true
        type: choice
        default: all
        options:
          - all
          - purchase-invoices

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ikcyvlovptebroadgtvd.supabase.co

jobs:
  e2e:
    name: Playwright E2E (build + serve in-CI)
    if: github.event_name == 'workflow_dispatch' && inputs.allow_dev_mutations == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # S77 post-merge: no `version:` — the action reads package.json's
      # packageManager. Pinning a version here conflicted with it
      # ("Multiple versions of pnpm specified") and killed every nightly E2E
      # run in ~10s — the D-8 S76 "missing secrets" theory was stale, the 3
      # E2E secrets have existed since 2026-07-09.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # pnpm 11 (packageManager, 2026-08-10) requiert Node >= 22.13
          # (node:sqlite) — sur Node 20 le job meurt au `pnpm store path`.
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Require dev V3 target and supported suite before provisioning
        env:
          E2E_SUITE: ${{ inputs.suite }}
          PGURL: ${{ secrets.V3_DEV_PG_POOLER_URL }}
        run: |
          node --test scripts/e2e/assert-dev-target.test.mjs
          node scripts/e2e/assert-dev-target.mjs
          case "$E2E_SUITE" in
            all|purchase-invoices) ;;
            *) echo "::error::Unsupported E2E suite"; exit 1 ;;
          esac

      - name: Provision E2E state (PINs + open shift)
        if: inputs.suite == 'all'
        env:
          PGURL: ${{ secrets.V3_DEV_PG_POOLER_URL }}
          E2E_PIN_ADMIN: ${{ secrets.E2E_PIN_ADMIN }}
          E2E_PIN_CASHIER: ${{ secrets.E2E_PIN_CASHIER }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 \
            -v adminpin="$E2E_PIN_ADMIN" -v cashpin="$E2E_PIN_CASHIER" \
            -f scripts/e2e/provision-pins.sql

      - name: Provision BO owner PIN only
        if: inputs.suite == 'purchase-invoices'
        env:
          PGURL: ${{ secrets.V3_DEV_PG_POOLER_URL }}
          E2E_PIN_ADMIN: ${{ secrets.E2E_PIN_ADMIN }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 \
            -v adminpin="$E2E_PIN_ADMIN" \
            -f scripts/e2e/provision-bo-pin.sql

      - name: Run Playwright tests
        run: |
          case "$E2E_SUITE" in
            all) pnpm exec playwright test ;;
            purchase-invoices) pnpm exec playwright test tests/e2e/po-receive.spec.ts --project=backoffice ;;
            *) echo "::error::Unsupported E2E suite"; exit 1 ;;
          esac
        env:
          E2E_SUITE: ${{ inputs.suite }}
          CI: 'true'
          E2E_SKIP_POS_SERVER: ${{ inputs.suite == 'purchase-invoices' && '1' || '0' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_POS_URL: http://localhost:5173
          E2E_BO_URL: http://localhost:5174
          E2E_PIN_ADMIN: ${{ secrets.E2E_PIN_ADMIN }}
          E2E_PIN_CASHIER: ${{ secrets.E2E_PIN_CASHIER }}

      - name: Measure POS route JavaScript
        if: inputs.suite == 'all'
        run: node scripts/ci/pos-route-bundles.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            apps/pos/dist/route-budgets.json
          retention-days: 7
