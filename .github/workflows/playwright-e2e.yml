name: Playwright E2E

# Build-and-serve-in-CI model (S71). The job builds both apps and serves them
# on localhost via Playwright's webServer, pointing at the dev V3 backend.
# No hosted staging URLs, no Vercel.
#
# Required secrets:
#   VITE_SUPABASE_ANON_KEY   — dev V3 anon (publishable) key (build-time)
#   E2E_PIN_ADMIN            — 6-digit PIN for E2E owner  (0e2e0000-…-001)
#   E2E_PIN_CASHIER          — 6-digit PIN for E2E cashier (0e2e0000-…-002)
#   V3_DEV_PG_POOLER_URL     — pooler connection string (already set 2026-05-16)
#
# Nightly cron armed S71 Plan 2 once all 12 specs proved green in a combined
# run (26 passed / 2 intentional fixmes / 0 failed). 22:00 UTC daily. The
# rate-limit-resilient login (fixtures/auth.ts) keeps the bunched-login run
# green against the auth-verify-pin 3/min/IP limit. Still dispatchable on demand.
# POS audit 2026-09-10: cash and QRIS checkout pass on dev again.
# The PR gate covers the critical sales flow; scheduled runs include viewport checks.
on:
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/pos/**'
      - 'apps/print-bridge/**'
      - 'packages/domain/**'
      - 'packages/ui/**'
      - 'packages/supabase/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/playwright-e2e.yml'
  workflow_dispatch:
  schedule:
    # Quota 2026-07 — 2×/semaine au lieu de quotidien (~-300 min/mois).
    # 22:00 UTC lun/jeu = 05:00 Asia/Jakarta mar/ven. Dispatchable à la
    # demande entre deux crons.
    - cron: '0 22 * * 1,4'

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ikcyvlovptebroadgtvd.supabase.co

jobs:
  e2e:
    name: Playwright E2E (build + serve in-CI)
    # Les secrets Dependabot sont un magasin séparé : E2E_PIN_* et le pooler y
    # sont vides, le provisioning échouerait. Un bump de dépendance ne casse
    # pas le money-path — on saute, comme le fait pgtap-pr.yml.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Sur PR : money-path seul, et pas de build back-office.
      E2E_SKIP_BO_SERVER: ${{ github.event_name == 'pull_request' && '1' || '' }}

    steps:
      - uses: actions/checkout@v7

      # S77 post-merge: no `version:` — the action reads package.json's
      # packageManager. Pinning a version here conflicted with it
      # ("Multiple versions of pnpm specified") and killed every nightly E2E
      # run in ~10s — the D-8 S76 "missing secrets" theory was stale, the 3
      # E2E secrets have existed since 2026-07-09.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # pnpm 11 (packageManager, 2026-08-10) requiert Node >= 22.13
          # (node:sqlite) — sur Node 20 le job meurt au `pnpm store path`.
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Provision E2E state (PINs + open shift)
        env:
          PGURL: ${{ secrets.V3_DEV_PG_POOLER_URL }}
          E2E_PIN_ADMIN: ${{ secrets.E2E_PIN_ADMIN }}
          E2E_PIN_CASHIER: ${{ secrets.E2E_PIN_CASHIER }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 \
            -v adminpin="$E2E_PIN_ADMIN" -v cashpin="$E2E_PIN_CASHIER" \
            -f scripts/e2e/provision-pins.sql

      # Sur PR : les 3 specs du chemin de l'argent (connexion caisse, commande
      # complète, money-path S44). Sur cron / dispatch : les 12.
      - name: Run Playwright tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec playwright test --project=pos \
              tests/e2e/pos-login-order.spec.ts \
              tests/e2e/complete-order.spec.ts \
              tests/e2e/s44-money-path.spec.ts
          else
            pnpm exec playwright test
          fi
        env:
          CI: 'true'
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_POS_URL: http://localhost:5173
          E2E_BO_URL: http://localhost:5174
          E2E_PIN_ADMIN: ${{ secrets.E2E_PIN_ADMIN }}
          E2E_PIN_CASHIER: ${{ secrets.E2E_PIN_CASHIER }}

      - name: Measure POS route JavaScript
        run: node scripts/ci/pos-route-bundles.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            apps/pos/dist/route-budgets.json
          retention-days: 7
