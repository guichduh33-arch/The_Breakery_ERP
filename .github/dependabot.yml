# Quota Actions 2026-07 — updates hebdomadaires et GROUPÉS : 1 PR npm + 1 PR
# actions par semaine au lieu d'une PR par dépendance (chaque PR bot déclenche
# un run CI complet). Les alertes de sécurité restent immédiates — Dependabot
# security updates est un mécanisme séparé, non affecté par ce schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    groups:
      npm-all:
        patterns:
          - "*"
    # Majeures exclues du bump auto : une seule majeure cassante (TS 7, eslint 10…)
    # rougit toute la PR groupée. Les majeures se traitent en chantier dédié.
    # Les security updates ne sont PAS affectées (mécanisme séparé).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns:
          - "*"
